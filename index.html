<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>All In | Goals</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>(function(){var t=localStorage.getItem('theme:preference');if(!t)t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="topbar.js" defer></script>
<script src="time-blocking.js" defer></script>
<style>
:root, [data-theme="dark"] {
  --bg: #050506;
  --bg-card: rgba(255,255,255,0.04);
  --bg-secondary: rgba(255,255,255,0.035);
  --bg-input: rgba(0,0,0,0.28);
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.12);
  --border-soft: rgba(255,255,255,0.04);
  --overlay-soft: rgba(255,255,255,0.04);
  --overlay-hover: rgba(255,255,255,0.06);
  --overlay-active: rgba(255,255,255,0.12);
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --text-faint: rgba(255,255,255,0.18);
  --success: #6BE3A4;
  --warning: #F2C063;
  --danger: #FF6B6B;
  --accent-gold: #d4a853;
  --accent-gold-glow: rgba(212,168,83,0.35);
  --card-shadow: 0 12px 40px rgba(0,0,0,0.45);
  --font: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bg-modal: #131316;
  --btn-primary: linear-gradient(180deg, #fff 0%, #E8E5DD 100%);
  --btn-primary-color: #0a0a0b;
  --btn-primary-shadow: 0 2px 8px rgba(0,0,0,0.35);
}
[data-theme="light"] {
  --bg: #f5f5f5;
  --bg-card: #ffffff;
  --bg-secondary: #efefef;
  --bg-input: rgba(0,0,0,0.04);
  --border: rgba(0,0,0,0.10);
  --border-strong: rgba(0,0,0,0.18);
  --border-soft: rgba(0,0,0,0.05);
  --overlay-hover: rgba(0,0,0,0.05);
  --overlay-active: rgba(0,0,0,0.08);
  --text-primary: #1a1a1a;
  --text-secondary: #555555;
  --text-tertiary: #888888;
  --text-faint: rgba(0,0,0,0.18);
  --success: #00a860;
  --warning: #c48a00;
  --danger: #cc3333;
  --accent-gold: #b8943f;
  --accent-gold-glow: rgba(184,148,63,0.35);
  --card-shadow: 0 2px 16px rgba(0,0,0,0.08);
  --bg-modal: #ffffff;
  --btn-primary: linear-gradient(135deg, #d4a853, #b8943f);
  --btn-primary-color: #ffffff;
  --btn-primary-shadow: 0 2px 8px rgba(0,0,0,0.18);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(224, 118, 88, 0.16), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(180, 180, 200, 0.06), transparent 50%);
  filter: blur(40px);
  pointer-events: none;
  z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: -1;
}
@keyframes drift {
  0%   { transform: translate3d(0,0,0); }
  100% { transform: translate3d(-22px, 14px, 0); }
}

.page {
  max-width: 1100px;
  margin: 0 auto;
}

/* ===== Component 1: page title ===== */
.dash-title {
  margin: 0 0 14px;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.025em;
  background: linear-gradient(180deg, var(--text-primary) 0%, var(--text-secondary) 120%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
@media (max-width: 480px) { .dash-title { font-size: 22px; } }
.dash-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.dash-top .dash-title { margin-bottom: 0; flex: 1; }

/* ===== Component 2: Goal Ticker ===== */
.ticker-row {
  display: grid;
  grid-template-columns: 1fr;
  gap: 4px;
  margin-bottom: 18px;
}
.goal-ticker {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px;
  border-radius: 12px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
}
.goal-ticker::after {
  content: '';
  position: absolute; top: 0; bottom: 0;
  width: 30%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
  pointer-events: none;
  animation: ticker-sweep 8s linear infinite;
}
@keyframes ticker-sweep {
  0%   { left: -40%; }
  100% { left: 110%; }
}
.goal-ticker-led { display: inline-flex; align-items: center; }
.goal-ticker-led-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 8px var(--accent-gold-glow);
  animation: led-pulse 1.6s ease-in-out infinite;
}
@keyframes led-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.45; transform: scale(0.85); }
}
.goal-ticker-label {
  font-family: var(--font-mono);
  font-size: 9.5px; font-weight: 800;
  letter-spacing: 0.18em;
  color: var(--text-tertiary);
}
.goal-ticker-stage {
  position: relative; overflow: hidden;
  flex: 1; height: 22px;
}
.goal-ticker-row {
  position: absolute; inset: 0;
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono);
  font-size: 12.5px; font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
  white-space: nowrap;
}
.goal-ticker-row.is-leaving  { animation: ticker-leave 0.45s cubic-bezier(0.55, 0, 0.55, 1) forwards; }
.goal-ticker-row.is-entering { animation: ticker-enter 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
@keyframes ticker-leave { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-100%); } }
@keyframes ticker-enter { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
.goal-ticker-status {
  display: inline-flex; justify-content: center;
  width: 18px;
  color: var(--text-tertiary);
}
.goal-ticker-status[data-status="done"]    { color: var(--success); }
.goal-ticker-status[data-status="pending"] { color: var(--text-tertiary); }
.goal-ticker-text {
  flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.goal-ticker-meta {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  color: var(--text-secondary);
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--overlay-hover);
}
@media (max-width: 480px) {
  .goal-ticker { padding: 9px 12px; }
  .goal-ticker-label { font-size: 9px; letter-spacing: 0.14em; }
  .goal-ticker-row { font-size: 12px; }
  .goal-ticker-meta { font-size: 10px; padding: 2px 7px; }
}

/* ===== Component 3: Day Ring ===== */
.day-ring-wrap {
  display: flex; flex-wrap: wrap;
  align-items: center; justify-content: center;
  gap: 26px;
  padding: 22px;
  margin-bottom: 22px;
  border-radius: 16px;
  background: var(--bg-card);
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: var(--card-shadow);
}
.day-ring {
  position: relative;
  width: 168px; height: 168px;
  flex-shrink: 0;
}
.day-ring svg { width: 100%; height: 100%; display: block; }
.day-ring-track { fill: none; stroke: var(--border); stroke-width: 8; }
.day-ring-fill {
  fill: none;
  stroke-width: 8;
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: 60px 60px;
  transition: stroke 0.7s cubic-bezier(0.22, 1, 0.36, 1),
              stroke-dashoffset 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}
.day-ring-overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none;
}
.day-ring-percent {
  font-size: 40px; font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.04em;
  color: var(--text-primary);
  line-height: 1;
}
.day-ring-phase {
  margin-top: 5px;
  font-family: var(--font-mono);
  font-size: 9.5px; font-weight: 800;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-tertiary);
}
.day-ring-clock {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-tertiary);
  margin-top: 2px;
}
.day-ring-text {
  display: flex; flex-direction: column;
  gap: 6px;
  max-width: 280px;
}
.day-ring-status { font-size: 14px; font-weight: 700; color: var(--text-primary); }
.day-ring-remaining { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); }
.day-ring-hours { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); }
@media (max-width: 480px) {
  .day-ring { width: 144px; height: 144px; }
  .day-ring-percent { font-size: 32px; }
  .day-ring-status { font-size: 13px; }
}

/* ===== Component 4: section + To Do List ===== */
.section { margin-top: 8px; }
.section-title {
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary);
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px;
}
.section-title::before {
  content: ''; width: 18px; height: 1px;
  background: var(--text-tertiary); opacity: 0.6;
}
.section-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--border-strong), transparent);
}

.gm-card {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 14px;
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: var(--card-shadow);
  transition: background 0.4s;
  overflow: hidden;
}
.gm-card.gm-all-done::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(107,227,164,0.10), transparent 60%);
  pointer-events: none;
}
.gm-card.gm-all-done .gm-progress-num,
.gm-card.gm-all-done .gm-progress-label { color: var(--success); }

.gm-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
  margin-bottom: 14px;
  position: relative;
}
.gm-header-left { display: flex; flex-direction: column; }
.gm-eyebrow {
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 6px;
}
.gm-progress-row { display: flex; align-items: baseline; gap: 6px; }
.gm-progress-num {
  font-size: 42px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.045em;
  color: var(--text-primary);
  line-height: 1;
}
.gm-progress-total {
  font-family: var(--font-mono);
  font-size: 18px;
  color: var(--text-tertiary);
}
.gm-progress-label {
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--text-tertiary);
  margin-left: 4px;
}

.gm-streak {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 12px;
  border-radius: 999px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-tertiary);
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.10em; text-transform: uppercase;
  transition: background 0.25s, color 0.25s, border-color 0.25s;
}
.gm-streak-icon { font-size: 13px; }
.gm-streak-num {
  font-family: var(--font-mono);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.gm-streak.gm-streak-active {
  background: rgba(212,168,83,0.10);
  color: var(--warning);
  border-color: rgba(212,168,83,0.32);
}
.gm-streak.gm-streak-active .gm-streak-icon {
  filter: drop-shadow(0 0 6px rgba(212,168,83,0.6));
}

.gm-bar {
  display: flex; gap: 4px;
  height: 6px;
  margin-bottom: 16px;
}
.gm-bar:empty { display: none; }
.gm-bar-seg {
  flex: 1;
  background: var(--border);
  border-radius: 3px;
  transition: background 0.3s, box-shadow 0.3s;
}
.gm-bar-seg-done {
  background: var(--success);
  box-shadow: 0 0 6px var(--accent-gold-glow);
}

.goal-list { list-style: none; margin: 0; padding: 0; }
.empty-state {
  text-align: center;
  font-size: 12px; font-style: italic;
  color: var(--text-tertiary);
  padding: 14px 0;
}

.gm-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  margin-bottom: 6px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 12px;
  transition: background 0.2s, opacity 0.3s;
  position: relative;
}
.gm-row:hover { background: var(--overlay-hover); }
.gm-row.gm-row-done {
  opacity: 0.45;
  background: rgba(107,227,164,0.04);
}
.gm-row.gm-row-done .gm-text {
  text-decoration: line-through;
  text-decoration-color: var(--border-strong);
}
.gm-row.gm-row-queued {
  background: rgba(212,168,83,0.10);
  box-shadow: inset 3px 0 0 0 var(--warning);
}
.gm-row.gm-row-queued .gm-text { color: var(--warning); }
.gm-row.is-drag-over { border-top: 2px solid var(--success); }
.gm-row.is-queue-flashing { animation: gm-queue-flash 0.48s ease-out; }
@keyframes gm-queue-flash {
  0%   { background: var(--bg-secondary); transform: scale(1); }
  40%  { background: rgba(212,168,83,0.32); transform: scale(1.015); }
  100% { background: var(--bg-secondary); transform: scale(1); }
}

.gm-handle {
  width: 14px; flex-shrink: 0;
  color: var(--text-tertiary);
  font-weight: 700; font-size: 14px;
  letter-spacing: -2px;
  cursor: grab;
  opacity: 0;
  transition: opacity 0.2s;
  user-select: none;
}
.gm-row:hover .gm-handle { opacity: 1; }
.gm-handle:active { cursor: grabbing; }

.gm-check {
  appearance: none; -webkit-appearance: none;
  width: 22px; height: 22px; flex-shrink: 0;
  margin: 0;
  border: 1.5px solid var(--border-strong);
  background: var(--bg-input);
  border-radius: 7px;
  position: relative;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, box-shadow 0.25s;
}
.gm-check:checked {
  background: var(--success);
  border-color: var(--success);
  box-shadow: 0 0 12px var(--accent-gold-glow);
}
.gm-check:checked::after {
  content: '';
  position: absolute; left: 6px; top: 2px;
  width: 6px; height: 11px;
  border: solid var(--bg);
  border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg);
  animation: gm-check-pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes gm-check-pop {
  from { transform: rotate(45deg) scale(0); }
  to   { transform: rotate(45deg) scale(1); }
}
.gm-check:disabled { cursor: not-allowed; opacity: 0.55; }

.gm-text {
  flex: 1;
  font-size: 14px;
  color: var(--text-primary);
  cursor: text;
  outline: none;
  border-radius: 4px;
  padding: 2px 4px;
  margin: -2px -4px;
}
.gm-text[contenteditable="true"] {
  outline: 1px solid var(--border-strong);
  background: var(--bg-input);
}

.gm-queue-btn {
  border: 0; background: transparent;
  color: var(--text-tertiary);
  font-size: 14px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 6px;
  opacity: 0.55;
  transition: opacity 0.2s, color 0.2s, transform 0.1s;
}
.gm-queue-btn:hover { opacity: 1; }
.gm-queue-btn.gm-queue-active {
  color: var(--warning);
  opacity: 1;
  filter: drop-shadow(0 0 4px rgba(212,168,83,0.65));
}
.gm-queue-btn:disabled { cursor: not-allowed; opacity: 0.3; }

.goal-delete {
  border: 0; background: transparent;
  color: var(--text-tertiary);
  font-size: 18px;
  cursor: pointer;
  padding: 0 4px;
  opacity: 0.5;
  transition: opacity 0.2s, color 0.2s;
}
.gm-row:hover .goal-delete { opacity: 1; }
.goal-delete:hover { color: var(--danger); }

.gm-show-toggle {
  width: 100%;
  margin: 6px 0 0;
  padding: 9px;
  border: 1px dashed var(--border-strong);
  border-radius: 10px;
  background: transparent;
  color: var(--text-tertiary);
  font-family: inherit;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
}
.gm-show-toggle:hover { color: var(--text-primary); border-color: var(--border-strong); }

.gm-push-btn {
  width: 100%;
  margin-top: 14px;
  padding: 11px;
  border: 1px dashed var(--border-strong);
  border-radius: 12px;
  background: transparent;
  color: var(--text-tertiary);
  font-family: inherit;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.10em; text-transform: uppercase;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}
.gm-push-btn:hover {
  color: var(--text-primary);
  border-color: var(--border-strong);
  border-style: solid;
  background: var(--bg-card);
}

.goal-input-wrap.gm-input-wrap {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}
.gm-input {
  flex: 1; min-width: 0;
  padding: 11px 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-input);
  color: var(--text-primary);
  font-family: inherit; font-size: 14px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}
.gm-input::placeholder { color: var(--text-tertiary); }
.gm-input:focus { border-color: var(--border-strong); background: var(--bg-input); }

.gm-add {
  padding: 11px 20px;
  border: 0; border-radius: 12px;
  background: var(--btn-primary);
  color: var(--btn-primary-color);
  font-family: inherit; font-size: 13px; font-weight: 700;
  cursor: pointer;
  box-shadow: var(--btn-primary-shadow);
  transition: transform 0.1s, filter 0.15s;
}
.gm-add:hover { filter: brightness(1.06); transform: translateY(-1px); }
.gm-add:active { transform: translateY(0); }

.gm-polish {
  padding: 11px 18px;
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  background: var(--overlay-hover);
  color: var(--text-primary);
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.gm-polish:hover {
  background: var(--overlay-active);
  border-color: var(--border-strong);
}

.gm-status {
  flex-basis: 100%;
  font-size: 11px;
  color: var(--text-tertiary);
  min-height: 14px;
  margin-top: 4px;
}
.gm-status.gm-status-error { color: var(--danger); }

@media (max-width: 480px) {
  body { padding: max(20px, env(safe-area-inset-top)) 14px 50px; }
  .gm-card { padding: 16px; }
  .gm-progress-num { font-size: 36px; }
}

/* ===== Time Blocking ===== */
.tb-card { padding: 18px 0 0; overflow: visible; }

.tb-stats {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  padding: 0 20px 14px;
  border-bottom: 1px solid var(--border-soft);
}
.tb-stat-done { color: var(--success); }
.tb-stat-sep  { opacity: 0.4; }

.tb-scroll {
  overflow-y: auto;
  max-height: 520px;
  -webkit-overflow-scrolling: touch;
}
.tb-scroll::-webkit-scrollbar { width: 4px; }
.tb-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

/* Timeline container */
.tb-tl {
  position: relative;
  width: 100%;
  padding-bottom: 24px;
  cursor: crosshair;
}

/* Hour labels */
.tb-hlbl {
  position: absolute;
  left: 0; width: 44px;
  transform: translateY(-50%);
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text-tertiary);
  text-align: right;
  padding-right: 8px;
  pointer-events: none;
  user-select: none;
}

/* Hour gridlines */
.tb-hline {
  position: absolute;
  left: 44px; right: 0;
  height: 1px;
  background: var(--border);
  pointer-events: none;
}
.tb-halfline {
  position: absolute;
  left: 44px; right: 0;
  height: 1px;
  background: var(--border-soft);
  pointer-events: none;
}

/* Now indicator */
.tb-now {
  position: absolute;
  left: 40px; right: 0;
  height: 2px;
  background: var(--danger);
  box-shadow: 0 0 8px var(--accent-gold-glow);
  pointer-events: none;
  z-index: 10;
}
.tb-now::before {
  content: '';
  position: absolute;
  left: -5px; top: -4px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--danger);
  box-shadow: 0 0 8px var(--accent-gold-glow);
}
.tb-now-t {
  position: absolute;
  right: 6px; top: -9px;
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 700;
  color: var(--danger);
  letter-spacing: 0.05em;
}

/* Time block cards */
.tb-block {
  position: absolute;
  left: 50px; right: 8px;
  border-radius: 8px;
  background: color-mix(in srgb, var(--bc) 18%, rgba(0,0,0,0.55));
  border-left: 3px solid var(--bc);
  border-top: 1px solid color-mix(in srgb, var(--bc) 35%, transparent);
  box-shadow: 0 2px 12px rgba(0,0,0,0.35);
  cursor: pointer;
  transition: box-shadow 0.2s, opacity 0.2s;
  overflow: hidden;
  z-index: 5;
  touch-action: none;
}
.tb-block:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.5); }
.tb-block.tb-past  { opacity: 0.6; }
.tb-block.tb-cur   { box-shadow: 0 0 0 1px var(--bc), 0 4px 20px rgba(0,0,0,0.5), 0 0 14px color-mix(in srgb, var(--bc) 30%, transparent); }
.tb-block.tb-done  { opacity: 0.5; }
.tb-block.tb-dragging { opacity: 0.85; box-shadow: 0 8px 30px rgba(0,0,0,0.6); z-index: 20; cursor: grabbing; }

.tb-block-in {
  padding: 5px 8px 5px 6px;
  display: flex; flex-direction: column; gap: 2px;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  position: relative;
}
.tb-block-ttl {
  font-size: 12px; font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 1.2;
}
.tb-block-t {
  font-family: var(--font-mono);
  font-size: 9.5px; font-weight: 600;
  color: color-mix(in srgb, var(--bc) 80%, #fff);
  white-space: nowrap;
  letter-spacing: 0.03em;
}
.tb-block-chk {
  position: absolute; top: 5px; right: 8px;
  font-size: 11px; color: var(--success);
}
.tb-block-link {
  position: absolute; bottom: 5px; right: 8px;
  font-size: 9px; opacity: 0.7;
}

/* Resize handle */
.tb-rh {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 10px;
  cursor: ns-resize;
  display: flex; align-items: center; justify-content: center;
}
.tb-rh::after {
  content: '';
  width: 24px; height: 2px;
  border-radius: 1px;
  background: var(--text-faint);
  transition: background 0.2s;
}
.tb-block:hover .tb-rh::after { background: var(--border-strong); }

/* ── Modal ── */
body.tb-no-scroll { overflow: hidden; }

.tb-modal-bg {
  position: fixed; inset: 0; z-index: 9000;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.tb-modal {
  background: var(--bg-modal);
  border: 1px solid var(--border-strong);
  border-radius: 18px;
  width: 100%; max-width: 400px;
  max-height: 90vh; overflow-y: auto;
  padding: 22px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.7);
}
.tb-modal-hd {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.tb-modal-ttl {
  font-size: 15px; font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}
.tb-modal-x {
  border: 0; background: transparent;
  color: var(--text-tertiary);
  font-size: 22px; line-height: 1;
  cursor: pointer; padding: 0 4px;
  transition: color 0.2s;
}
.tb-modal-x:hover { color: var(--text-primary); }

.tb-mf { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.tb-mf-row { flex-direction: row; gap: 10px; }
.tb-mf-half { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.tb-ml {
  font-size: 9.5px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-tertiary);
}
.tb-mi {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-input);
  color: var(--text-primary);
  font-family: inherit; font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
.tb-mi:focus { border-color: var(--border-strong); }
.tb-mi::placeholder { color: var(--text-tertiary); }
.tb-msel { cursor: pointer; }
.tb-mta  { resize: vertical; min-height: 60px; }

/* Category picker */
.tb-cats {
  display: flex; flex-wrap: wrap; gap: 6px;
}
.tb-cat {
  padding: 5px 11px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--overlay-hover);
  color: var(--text-secondary);
  font-family: inherit; font-size: 11px; font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.tb-cat:hover { border-color: var(--cc); color: var(--cc); }
.tb-cat.tb-cat-on {
  background: color-mix(in srgb, var(--cc) 22%, transparent);
  border-color: var(--cc);
  color: var(--cc);
}

/* Modal actions */
.tb-mac {
  display: flex; align-items: center;
  flex-wrap: wrap; gap: 8px;
  margin-top: 6px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.tb-mchk {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text-secondary);
  cursor: pointer; margin-right: auto;
}
.tb-mbtn {
  padding: 9px 18px;
  border-radius: 10px;
  border: 1px solid transparent;
  font-family: inherit; font-size: 12px; font-weight: 700;
  cursor: pointer;
  transition: filter 0.15s, transform 0.1s;
}
.tb-mbtn:hover { filter: brightness(1.1); }
.tb-mbtn:active { transform: scale(0.97); }
.tb-mbtn-pri {
  background: var(--btn-primary);
  color: var(--btn-primary-color);
  box-shadow: var(--btn-primary-shadow);
}
.tb-mbtn-sec {
  background: var(--overlay-hover);
  border-color: var(--border-strong);
  color: var(--text-secondary);
}
.tb-mbtn-danger {
  background: var(--overlay-hover);
  border-color: var(--border-strong);
  color: var(--danger);
}
.tb-mbtn:disabled { opacity: 0.5; cursor: not-allowed; }

@media (max-width: 480px) {
  .tb-scroll { max-height: 420px; }
}

.obj-card-actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border-soft); }
.obj-action-btn {

}
.rt-modal {
  background: var(--bg-modal); border: 1px solid var(--border-strong);
  border-radius: 18px; width: 100%; max-width: 420px;
  max-height: 90vh; overflow-y: auto; padding: 22px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.7);
}
.rt-modal-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.rt-modal-ttl { font-size: 15px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }
.rt-modal-x { border: 0; background: transparent; color: var(--text-tertiary); font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px; transition: color 0.2s; }
.rt-modal-x:hover { color: var(--text-primary); }
.rt-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.rt-label { font-size: 9.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-tertiary); }
.rt-input {
  width: 100%; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--bg-input); color: var(--text-primary);
  font-family: inherit; font-size: 13px; outline: none;
  transition: border-color 0.2s; -webkit-appearance: none;
}
.rt-input:focus { border-color: var(--border-strong); }
.rt-input::placeholder { color: var(--text-tertiary); }
.rt-modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; padding-top: 16px; border-top: 1px solid var(--border); }
.rt-mbtn { padding: 9px 18px; border-radius: 10px; border: 1px solid transparent; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; transition: filter 0.15s; }
.rt-mbtn:hover { filter: brightness(1.1); }
.rt-mbtn-pri { background: var(--btn-primary); color: var(--btn-primary-color); box-shadow: var(--btn-primary-shadow); }
.rt-mbtn-sec { background: var(--overlay-hover); border-color: var(--border-strong); color: var(--text-secondary); }
.rt-mbtn-danger { background: var(--overlay-hover); border-color: var(--border-strong); color: var(--danger); }
.rt-chal-habits { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.rt-chal-habit-opt {
  display: flex; align-items: center; gap: 6px; padding: 5px 10px;
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--overlay-hover); font-size: 12px; color: var(--text-secondary);
  cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s; user-select: none;
}
.rt-chal-habit-opt.selected { background: var(--overlay-active); border-color: var(--border-strong); color: var(--success); }
.rt-note-btn { background: transparent; border: 0; font-size: 12px; cursor: pointer; color: var(--text-tertiary); opacity: 0.5; padding: 0 2px; transition: opacity 0.15s; }
.rt-note-btn:hover, .rt-note-btn.has-note { opacity: 1; color: var(--warning); }
</style>
</head>
<body>
<div class="page">

  <div class="dash-top">
    <h1 class="dash-title">My Dashboard</h1>
    <div id="user-menu" style="padding-top:6px"></div>
  </div>

  <div class="ticker-row">
    <div class="goal-ticker" id="goalTicker" aria-live="polite" aria-atomic="true">
      <div class="goal-ticker-led"><span class="goal-ticker-led-dot"></span></div>
      <div class="goal-ticker-label">GOALS</div>
      <div class="goal-ticker-stage" id="goalTickerStage">
        <div class="goal-ticker-row">
          <span class="goal-ticker-status" data-status="">—</span>
          <span class="goal-ticker-text">Loading…</span>

      <div class="goal-ticker-meta" id="goalTickerMeta">0/0</div>
    </div>

  <div class="day-ring-wrap">
    <div class="day-ring">
      <svg viewBox="0 0 120 120">
        <defs>
          <filter id="dayRingGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.4" result="b" />
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle class="day-ring-track" cx="60" cy="60" r="52" />
        <circle class="day-ring-fill"  cx="60" cy="60" r="52" id="dayRingFill" filter="url(#dayRingGlow)" />
      </svg>

        <div class="day-ring-percent" id="dayRingPercent">—</div>
        <div class="day-ring-phase"   id="dayRingPhase">—</div>

    </div>
    <div class="day-ring-text">
      <div class="day-ring-status"    id="dayRingStatus">Loading…</div>
      <div class="day-ring-remaining" id="dayRingRemaining">—</div>
      <div class="day-ring-hours">8:00 AM – 12:00 AM</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">To Do List</div>

    <!-- TODAY -->
    <div class="gm-card" id="gmCardToday">
      <div class="gm-header">
        <div class="gm-header-left">
          <div class="gm-eyebrow" id="todayLabel">Today —</div>
          <div class="gm-progress-row">
            <span class="gm-progress-num"   id="gmProgressNum">0</span>
            <span class="gm-progress-total" id="gmProgressTotal">/ 0</span>
            <span class="gm-progress-label" id="gmProgressLabel">no goals yet</span>
          </div>
        </div>
        <div class="gm-streak" id="gmStreak">
          <span class="gm-streak-icon">⚡</span>
          <span class="gm-streak-num" id="gmStreakNum">0</span>

      </div>
      <div class="gm-bar" id="gmBar"></div>
      <ul id="goalList" class="goal-list gm-list"></ul>
      <div id="emptyState" class="empty-state">No goals for today yet — add one below.</div>
      <button type="button" id="gmPushBtn" class="gm-push-btn" style="display:none;">Push remaining to tomorrow</button>
      <div class="goal-input-wrap gm-input-wrap">
        <input id="goalInput" class="gm-input" type="text" placeholder="Add a goal for today…" autocomplete="off">
        <button type="button" id="goalAddBtn"    class="gm-add">+ Add</button>
        <button type="button" id="goalPolishBtn" class="gm-polish">✨ Polish</button>

        <button type="button" class="gm-link-toggle" id="gmLinkToggle">▸ Link to objective</button>
        <div class="gm-link-panel" id="gmLinkPanel">

  <!-- OBJECTIVES -->
  <div class="section">
    <div class="section-title">Objectives</div>
    <div class="gm-card">
      <div class="obj-tabs">
        <button type="button" class="obj-tab active" id="objTabMonth">This Month</button>
        <button type="button" class="obj-tab"        id="objTabYear">This Year</button>

      <div class="obj-tab-panel active" id="objPanelMonth">
        <button type="button" class="obj-new-btn" id="objNewMonthBtn">+ New Monthly Objective</button>
        <div id="objMonthList"></div>

        <div id="objYearList"></div>

  <!-- ROUTINE TRACKER -->
  <div class="section">
    <div class="section-title">Routine Tracker</div>
    <div class="gm-card">
      <div id="rtChallengeWrap"></div>
      <div class="rt-toolbar">
        <button type="button" class="rt-add-habit-btn" id="rtAddHabitBtn">+ Add Habit</button>
        <button type="button" class="rt-start-btn"     id="rtStartChallengeBtn">🏆 Start Challenge</button>
      </div>
      <div class="rt-grid-wrap">
        <div class="rt-grid" id="rtGrid"></div>

      <button type="button" class="rt-load-more" id="rtLoadMore">Load more ▾</button>
    </div>

</div>

<script type="module">
import { requireAuth } from './js/auth.js';
import { initUserMenu } from './js/user-menu.js';
import * as GoalsData from './js/goals-data.js';
import * as ObjData from './js/objectives-data.js';
import * as HabitsData from './js/habits-data.js';
import { supabase } from './js/supabase.js';

// ── Boot ──────────────────────────────────────────────────────
const user = await requireAuth();
await initUserMenu();

// ── Constants ─────────────────────────────────────────────────
const ANTHROPIC_API_KEY = '';

  const WAKE_HOUR  = 8;
  const SLEEP_HOUR = 24;
  const _now = new Date();
  const currentYear  = _now.getFullYear();
  const currentMonth = _now.getMonth() + 1;

  // ── Date helpers ─────────────────────────────────────────────
  function pad2(n) { return String(n).padStart(2, '0'); }
  function dateToKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function getActiveDateString() {
    const now = new Date();
    if (now.getHours() < 6) { const d = new Date(now); d.setDate(d.getDate() - 1); return dateToKey(d); }
    return dateToKey(now);
  }
  function getTomorrowDateString() {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    return dateToKey(d);
  }
  function formatDate(yyyy_mm_dd) {
    const parts = yyyy_mm_dd.split('-').map(Number);
    const d = new Date(parts[0], parts[1] - 1, parts[2]);
    const wk = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
    const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    return wk + ', ' + mo + ' ' + d.getDate();
  }
  function formatDateShort(yyyy_mm_dd) {
    const parts = yyyy_mm_dd.split('-').map(Number);
    const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parts[1] - 1];
    return mo + ' ' + parts[2];
  }
  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  const todayDateStr = getActiveDateString();

  // ── Rollover ──────────────────────────────────────────────────
  async function rollover() {
    const sessionKey = 'row_rolled_' + todayDateStr;
    if (sessionStorage.getItem(sessionKey)) return;
    sessionStorage.setItem(sessionKey, '1');
    const todayGoals = await GoalsData.loadGoals(todayDateStr);
    const texts = new Set(todayGoals.map(g => g.text));
    const oldUndone = await GoalsData.loadGoalsBefore(todayDateStr);
    if (!oldUndone.length) return;
    let pos = todayGoals.length;
    for (const g of oldUndone) {
      if (g.text && !texts.has(g.text)) {
        await GoalsData.addGoal(todayDateStr, g.text, pos++);
        texts.add(g.text);
      }
      await GoalsData.deleteGoal(g.id);
    }
  }

  // ── Streak ────────────────────────────────────────────────────
  async function processStreak() {
    const s = await GoalsData.loadStreak();
    const { data } = await supabase
      .from('goals').select('date, done').lt('date', todayDateStr).order('date');
    const byDate = {};
    (data || []).forEach(g => { if (!byDate[g.date]) byDate[g.date] = []; byDate[g.date].push(g); });
    const dates = Object.keys(byDate).sort();
    for (const d of dates) {
      if (s.lastProcessedDate && d <= s.lastProcessedDate) continue;
      const goals = byDate[d];
      if (!goals.length) continue;
      if (goals.every(g => g.done)) s.count += 1;
      else s.count = 0;
      s.lastProcessedDate = d;
    }
    await GoalsData.saveStreak(s.count, s.lastProcessedDate);
    return s;
  }

  // ── Topbar ────────────────────────────────────────────────────
  function updateTopbarGoals(goals) {
    const done = goals.filter(g => g.done).length;
    const total = goals.length;
    window.__rowProgress = window.__rowProgress || {};
    window.__rowProgress.goals = { done, total };
    window.dispatchEvent(new CustomEvent('rowprogress'));
  }

  // ── Goal Ticker ───────────────────────────────────────────────
  const tickerStage = document.getElementById('goalTickerStage');
  const tickerMeta  = document.getElementById('goalTickerMeta');
  let cycleIdx = 0;
  let tickerTimer = null;
  let currentTodayGoals = [];

  function buildTickerItems() {
    const goals = currentTodayGoals;
    const total = goals.length;
    const done  = goals.filter(g => g.done).length;
    if (total === 0) return { items: [{ status: 'empty',   text: 'No goals set for today — add one to get rolling.' }], done, total };
    if (done === total) return { items: [{ status: 'done', text: '✓ All goals done — solid day.' }], done, total };
    const items = goals.filter(g => !g.done).map(g => ({ status: 'pending', text: g.text }));
    return { items, done, total };
  }

  function statusGlyph(status) {
    if (status === 'done') return '✓';
    if (status === 'pending') return '○';
    return '·';
  }

  let firstTick = true;
  function tick() {
    const { items, done, total } = buildTickerItems();
    if (cycleIdx >= items.length) cycleIdx = 0;
    const item = items[cycleIdx];
    cycleIdx = (cycleIdx + 1) % items.length;

    const oldRow = tickerStage.querySelector('.goal-ticker-row');
    const newRow = document.createElement('div');
    newRow.className = 'goal-ticker-row';
    const status = document.createElement('span');
    status.className = 'goal-ticker-status';
    status.setAttribute('data-status', item.status);
    status.textContent = statusGlyph(item.status);
    const text = document.createElement('span');
    text.className = 'goal-ticker-text';
    text.textContent = item.text;
    newRow.appendChild(status);
    newRow.appendChild(text);

    if (oldRow && !firstTick) {
      oldRow.classList.add('is-leaving');
      setTimeout(() => oldRow.remove(), 460);
      newRow.classList.add('is-entering');
    } else if (oldRow) {
      oldRow.remove();
    }
    tickerStage.appendChild(newRow);
    firstTick = false;

    tickerMeta.textContent = done + '/' + total;
  }

  function startTicker() {
    tick();
    if (tickerTimer) clearInterval(tickerTimer);
    tickerTimer = setInterval(tick, 5000);
  }

  // ticker refreshes when loadToday() updates currentTodayGoals

  // ---------- Day Ring ----------
  const PALETTE = [
    [0,    [255, 216, 158]],
    [12.5, [255, 205, 121]],
    [25,   [255, 227, 143]],
    [37.5, [255, 183, 106]],
    [50,   [255, 149,  89]],
    [62.5, [243, 111,  79]],
    [75,   [226,  93, 122]],
    [87.5, [123,  91, 176]],
    [100,  [ 47,  58, 102]]
  ];
  function lerp(a, b, t) { return a + (b - a) * t; }
  function paletteAt(p) {
    if (p <= PALETTE[0][0]) return PALETTE[0][1];
    if (p >= PALETTE[PALETTE.length - 1][0]) return PALETTE[PALETTE.length - 1][1];
    for (let i = 0; i < PALETTE.length - 1; i++) {
      const [p0, c0] = PALETTE[i];
      const [p1, c1] = PALETTE[i + 1];
      if (p >= p0 && p <= p1) {
        const t = (p - p0) / (p1 - p0);
        return [lerp(c0[0], c1[0], t), lerp(c0[1], c1[1], t), lerp(c0[2], c1[2], t)];
      }
    }
    return [255,255,255];
  }
  function rgb(c) { return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')'; }

  function formatClock(d) {
    let h = d.getHours();
    const m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12;
    if (h === 0) h = 12;
    return h + ':' + pad2(m) + ' ' + ampm;
  }
  function formatRemaining(totalMin) {
    const h = Math.floor(totalMin / 60);
    const m = Math.floor(totalMin % 60);
    return h + 'h ' + m + 'm';
  }

  const C = 2 * Math.PI * 52;
  const fillEl = document.getElementById('dayRingFill');
  fillEl.setAttribute('stroke-dasharray', C);
  fillEl.setAttribute('stroke-dashoffset', C);

  function updateDayRing() {
    const now = new Date();
    const hours = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
    const percentEl   = document.getElementById('dayRingPercent');
    const phaseEl     = document.getElementById('dayRingPhase');
    const clockEl     = document.getElementById('dayRingClock');
    const statusEl    = document.getElementById('dayRingStatus');
    const remainingEl = document.getElementById('dayRingRemaining');

    clockEl.textContent = formatClock(now);

    if (hours < WAKE_HOUR) {
      fillEl.setAttribute('stroke-dashoffset', C);
      fillEl.style.stroke = getComputedStyle(document.documentElement).getPropertyValue('--text-tertiary').trim();
      percentEl.textContent = '—';
      phaseEl.textContent   = 'SLEEPING';
      statusEl.textContent  = '😴 Still sleeping';
      const minsUntil = (WAKE_HOUR - hours) * 60;
      remainingEl.textContent = formatRemaining(minsUntil) + ' until wake-up';
      return;
    }

    if (hours >= SLEEP_HOUR) {
      fillEl.setAttribute('stroke-dashoffset', 0);
      fillEl.style.stroke = getComputedStyle(document.documentElement).getPropertyValue('--danger').trim();
      percentEl.textContent = '100%';
      phaseEl.textContent   = 'PAST BEDTIME';
      statusEl.textContent  = '⚠️ Past bedtime';
      remainingEl.textContent = 'Sleep!';
      return;
    }

    const span = SLEEP_HOUR - WAKE_HOUR;
    const percent = (hours - WAKE_HOUR) / span * 100;
    fillEl.setAttribute('stroke-dashoffset', C * (1 - percent / 100));
    fillEl.style.stroke = rgb(paletteAt(percent));
    percentEl.textContent = Math.floor(percent) + '%';

    let phase, status;
    if (percent < 25)      { phase = 'MORNING';   status = '☀️ Morning — fresh start'; }
    else if (percent < 50) { phase = 'MIDDAY';    status = '⚡ Midday — keep moving'; }
    else if (percent < 75) { phase = 'AFTERNOON'; status = '🔥 Afternoon — push it'; }
    else if (percent < 90) { phase = 'EVENING';   status = '⏳ Evening — wrap up'; }
    else                   { phase = 'BEDTIME';   status = '🌙 Bedtime soon'; }
    phaseEl.textContent  = phase;
    statusEl.textContent = status;

    const minsLeft = (SLEEP_HOUR - hours) * 60;
    remainingEl.textContent = formatRemaining(minsLeft) + ' awake time left';
  }

  // ── Row building ──────────────────────────────────────────────

  function makeInlineEdit(textEl, goal, dateStr, reload) {
    textEl.addEventListener('click', () => {
      if (textEl.getAttribute('contenteditable') === 'true') return;
      const original = textEl.textContent;
      textEl.setAttribute('contenteditable', 'true');
      textEl.focus();
      const range = document.createRange();
      range.selectNodeContents(textEl);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
      async function commit() {
        const next = textEl.textContent.trim();
        textEl.removeAttribute('contenteditable');
        if (next && next !== original) {
          await GoalsData.updateGoal(goal.id, { text: next });
          reload();
        } else {
          textEl.textContent = original;
        }
      }
      function cancel() { textEl.removeAttribute('contenteditable'); textEl.textContent = original; }
      textEl.addEventListener('blur', commit, { once: true });
      textEl.addEventListener('keydown', function onKey(e) {
        if (e.key === 'Enter') { e.preventDefault(); textEl.removeEventListener('keydown', onKey); textEl.blur(); }
        else if (e.key === 'Escape') { e.preventDefault(); textEl.removeEventListener('keydown', onKey); cancel(); }
      });
    });
  }

  function wireDragReorder(row, dateStr, reload) {
    row.setAttribute('draggable', 'true');
    row.addEventListener('dragstart', (e) => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', row.dataset.idx);
    });
    row.addEventListener('dragover', (e) => { e.preventDefault(); row.classList.add('is-drag-over'); });
    row.addEventListener('dragleave', () => row.classList.remove('is-drag-over'));
    row.addEventListener('drop', async (e) => {
      e.preventDefault();
      row.classList.remove('is-drag-over');
      const from = parseInt(e.dataTransfer.getData('text/plain'), 10);
      const to   = parseInt(row.dataset.idx, 10);
      if (isNaN(from) || isNaN(to) || from === to) return;
      const goals = await GoalsData.loadGoals(dateStr);
      const [moved] = goals.splice(from, 1);
      goals.splice(to, 0, moved);
      await Promise.all(goals.map((g, i) => GoalsData.updateGoal(g.id, { position: i })));
      reload();
    });
  }

  function buildGoalRow(goal, idx, dateStr, readOnly, reload) {
    const li = document.createElement('li');
    li.className = 'gm-row';
    li.dataset.idx = String(idx);
    if (goal.done) li.classList.add('gm-row-done');
    if (goal.queued) li.classList.add('gm-row-queued');

    const handle = document.createElement('span');
    handle.className = 'gm-handle';
    handle.textContent = '⋮⋮';
    li.appendChild(handle);

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'gm-check';
    cb.checked = !!goal.done;
    if (readOnly) { cb.disabled = true; cb.title = 'Activates at 6 AM tomorrow'; }
    cb.addEventListener('change', async () => {
      await GoalsData.updateGoal(goal.id, {
        done: cb.checked,
        done_at: cb.checked ? new Date().toISOString() : null
      });
      reload();
    });
    li.appendChild(cb);

    const text = document.createElement('span');
    text.className = 'gm-text';
    text.textContent = goal.text;
    li.appendChild(text);
    makeInlineEdit(text, goal, dateStr, reload);

    const queueBtn = document.createElement('button');
    queueBtn.type = 'button';
    queueBtn.className = 'gm-queue-btn' + (goal.queued ? ' gm-queue-active' : '');
    queueBtn.textContent = '⚡';
    queueBtn.title = 'Queue for productivity window';
    if (readOnly) queueBtn.disabled = true;
    queueBtn.addEventListener('click', async () => {
      await GoalsData.updateGoal(goal.id, { queued: !goal.queued });
      li.classList.add('is-queue-flashing');
      setTimeout(reload, 480);
    });
    li.appendChild(queueBtn);

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'goal-delete';
    del.setAttribute('aria-label', 'Delete goal');
    del.textContent = '×';
    del.addEventListener('click', async () => {
      await GoalsData.deleteGoal(goal.id);
      reload();
    });
    li.appendChild(del);

    wireDragReorder(li, dateStr, reload);
    return li;
  }

  // ── Renderers ─────────────────────────────────────────────────

  function renderTodayHeader(goals) {
    const total = goals.length;
    const done  = goals.filter(g => g.done).length;
    document.getElementById('gmProgressNum').textContent   = done;
    document.getElementById('gmProgressTotal').textContent = '/ ' + total;
    const label = document.getElementById('gmProgressLabel');
    if (total === 0)         label.textContent = 'no goals yet';
    else if (done === total) label.textContent = 'all done — solid day';
    else                     label.textContent = 'complete';
    document.getElementById('todayLabel').textContent = 'Today — ' + formatDate(todayDateStr);
    const bar = document.getElementById('gmBar');
    bar.innerHTML = '';
    goals.forEach(g => {
      const seg = document.createElement('div');
      seg.className = 'gm-bar-seg' + (g.done ? ' gm-bar-seg-done' : '');
      bar.appendChild(seg);
    });
    document.getElementById('gmCardToday').classList.toggle('gm-all-done', total > 0 && done === total);
    document.getElementById('gmPushBtn').style.display = (total > 0 && done < total) ? 'block' : 'none';
  }

  async function renderStreak() {
    const s = await GoalsData.loadStreak();
    document.getElementById('gmStreakNum').textContent = s.count;
    document.getElementById('gmStreak').classList.toggle('gm-streak-active', s.count > 0);
  }

  function renderListInto(goals, listEl, emptyEl, dateStr, readOnly, onReload) {
    listEl.innerHTML = '';
    emptyEl.style.display = goals.length === 0 ? 'block' : 'none';
    const visible = goals.length > 5 ? goals.slice(0, 5) : goals;
    visible.forEach((g, i) => listEl.appendChild(buildGoalRow(g, i, dateStr, readOnly, onReload)));
    if (goals.length > 5) {
      let expanded = false;
      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'gm-show-toggle';
      const updateLabel = () => {
        toggle.textContent = expanded ? 'Show less ▴' : ('Show ' + (goals.length - 5) + ' more ▾');
      };
      updateLabel();
      toggle.addEventListener('click', () => {
        expanded = !expanded;
        if (expanded) {
          goals.slice(5).forEach((g, i) => {
            const row = buildGoalRow(g, i + 5, dateStr, readOnly, onReload);
            listEl.insertBefore(row, toggle);
          });
        } else {
          Array.from(listEl.querySelectorAll('.gm-row')).slice(5).forEach(r => r.remove());
        }
        updateLabel();
      });
      listEl.appendChild(toggle);
    }
  }

  async function loadToday() {
    const goals = await GoalsData.loadGoals(todayDateStr);
    currentTodayGoals = goals;
    renderListInto(goals, document.getElementById('goalList'), document.getElementById('emptyState'), todayDateStr, false, loadToday);
    renderTodayHeader(goals);
    updateTopbarGoals(goals);
    cycleIdx = 0; tick();
    // refresh objective progress when todos change
    loadObjectives();
  }

  // ── Push remaining ────────────────────────────────────────────
  document.getElementById('gmPushBtn').addEventListener('click', async () => {
    const today = await GoalsData.loadGoals(todayDateStr);
    const remaining = today.filter(g => !g.done);
    if (!remaining.length) return;
    if (!confirm('Move ' + remaining.length + ' unchecked goal' + (remaining.length === 1 ? '' : 's') + ' to tomorrow?')) return;
    const tomorrowStr = getTomorrowDateString();
    const tomorrow = await GoalsData.loadGoals(tomorrowStr);
    const seen = new Set(tomorrow.map(g => g.text));
    let pos = tomorrow.length;
    for (const g of remaining) {
      if (!seen.has(g.text)) { await GoalsData.addGoal(tomorrowStr, g.text, pos++); seen.add(g.text); }
      await GoalsData.deleteGoal(g.id);
    }
    loadToday();
  });

  function showStatus(el, message, isError) {
    el.textContent = message;
    el.classList.toggle('gm-status-error', !!isError);
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.textContent = ''; el.classList.remove('gm-status-error'); }, 3500);
  }

  async function polishOne(text) {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': ANTHROPIC_API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content:
            'Rewrite this single goal so it is concrete, action-oriented, and under 60 characters. ' +
            'Return ONLY a JSON array with exactly one string, no preamble, no code fences.\n\nGoal: ' + text
        }]
      })
    });
    const data = await res.json();
    const content = (data && data.content && data.content[0] && data.content[0].text) || '';
    const arr = JSON.parse(content);
    if (!Array.isArray(arr) || arr.length < 1 || typeof arr[0] !== 'string') throw new Error('bad response');
    return arr[0].trim();
  }

  function makeAddHandlers(inputEl, addBtn, polishBtn, dateStr, statusEl, reload) {
    async function plainAdd(text) {
      const goals = await GoalsData.loadGoals(dateStr);
      const monthlyEl = document.getElementById('gmLinkMonthly');
      const yearlyEl  = document.getElementById('gmLinkYearly');
      const extras = {
        linked_monthly_id: (monthlyEl && monthlyEl.value) || null,
        linked_yearly_id:  (yearlyEl  && yearlyEl.value)  || null,
      };
      await GoalsData.addGoal(dateStr, text, goals.length, extras);
      if (monthlyEl) monthlyEl.value = '';
      if (yearlyEl)  yearlyEl.value  = '';
      inputEl.value = '';
      reload();
    }
    addBtn.addEventListener('click', () => { const text = inputEl.value.trim(); if (!text) return; plainAdd(text); });
    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); } });
    polishBtn.addEventListener('click', async () => {
      const text = inputEl.value.trim();
      if (!text) return;
      if (!ANTHROPIC_API_KEY) { plainAdd(text); showStatus(statusEl, 'Polish needs an Anthropic API key — added as-typed.', false); return; }
      polishBtn.disabled = true;
      try { const polished = await polishOne(text); plainAdd(polished); }
      catch (e) { plainAdd(text); showStatus(statusEl, 'Polish failed — added as-typed.', true); }
      finally { polishBtn.disabled = false; }
    });
  }

      ObjData.loadMonthlyObjectives(currentYear, currentMonth),

  function populateObjectiveSelects() {
    const mSel = document.getElementById('gmLinkMonthly');

  function computeObjProgress(obj, linked) {
    if (obj.progress_mode === 'manual') return obj.manual_progress || 0;
    const goals = linked || [];
    if (!goals.length) return 0;
    return Math.round(goals.filter(g => g.done).length / goals.length * 100);
  }

    renderObjList('month');
    renderObjList('year');

  function renderObjList(which) {
    const listEl = document.getElementById(which === 'month' ? 'objMonthList' : 'objYearList');

      listEl.innerHTML = '<div class="empty-state">No objectives yet — add one above.</div>';
      return;

    objs.forEach(obj => listEl.appendChild(buildObjCard(obj, which)));

  function buildObjCard(obj, which) {
    const linked = which === 'month' ? (_monthlyLinked[obj.id] || []) : (_yearlyLinked[obj.id] || []);
    const pct    = computeObjProgress(obj, linked);
    const isDone = obj.status === 'Completed';

    const card = document.createElement('div');
    card.className = 'obj-card' + (isDone ? ' obj-done' : '');

    const hd = document.createElement('div');
    hd.className = 'obj-card-hd';

    const main = document.createElement('div');
    main.className = 'obj-card-main';
    main.innerHTML =
      `<div class="obj-title">${esc(obj.title)}${isDone ? '<span class="obj-done-badge">✓</span>' : ''}</div>` +
      `<div class="obj-meta">${obj.category ? `<span>${esc(obj.category)}</span>` : ''}<span>${obj.status}</span>${obj.target_date ? `<span>Due ${formatDateShort(obj.target_date)}</span>` : ''}</div>` +
      `<div class="obj-prog-row"><div class="obj-prog-bar-wrap"><div class="obj-prog-bar-fill" style="width:${pct}%"></div></div><div class="obj-prog-pct">${pct}%</div></div>` +
      (linked.length ? `<div class="obj-todo-count">${linked.filter(g=>g.done).length} / ${linked.length} todos completed</div>` : '');

    const expandBtn = document.createElement('button');
    expandBtn.type = 'button';
    expandBtn.className = 'obj-expand-btn';
    expandBtn.textContent = '▾';

    hd.appendChild(main);
    hd.appendChild(expandBtn);
    card.appendChild(hd);

    const children = document.createElement('div');
    children.className = 'obj-children';
    card.appendChild(children);

    const actions = document.createElement('div');
    actions.className = 'obj-card-actions';
    actions.style.display = 'none';
    const editBtn = document.createElement('button');
    editBtn.type = 'button'; editBtn.className = 'obj-action-btn'; editBtn.textContent = 'Edit';
    editBtn.addEventListener('click', e => { e.stopPropagation(); openObjModal(obj, which); });
    const delBtn = document.createElement('button');
    delBtn.type = 'button'; delBtn.className = 'obj-action-btn danger'; delBtn.textContent = 'Delete';
    delBtn.addEventListener('click', async e => {
      e.stopPropagation();
      if (!confirm('Delete this objective?')) return;
      if (which === 'month') await ObjData.deleteMonthlyObjective(obj.id);
      else await ObjData.deleteYearlyObjective(obj.id);
      loadObjectives();
    });
    actions.appendChild(editBtn); actions.appendChild(delBtn);
    card.appendChild(actions);

    let expanded = false;
    function toggle() {
      expanded = !expanded;
      expandBtn.classList.toggle('open', expanded);
      actions.style.display = expanded ? 'flex' : 'none';
      if (expanded && !children.childNodes.length) renderObjChildren(children, obj, which, linked);
      children.classList.toggle('open', expanded);
    }
    hd.addEventListener('click', toggle);
    expandBtn.addEventListener('click', e => { e.stopPropagation(); toggle(); });
    return card;
  }

  function renderObjChildren(container, obj, which, linkedGoals) {
    if (which === 'year') {
      const monthly = _monthlyObjs;
      if (!monthly.length) { container.innerHTML = '<div class="empty-state" style="font-size:11px">No monthly objectives for this year.</div>'; return; }
      monthly.forEach(mo => {

        const row = document.createElement('div');
        row.className = 'obj-child-row';
        row.innerHTML = `<div style="flex:1"><div style="font-size:13px;color:var(--text-primary)">${esc(mo.title)}</div>

            <div class="obj-prog-pct">${p}%</div>
          </div></div>`;
        container.appendChild(row);
      });
    } else {
      if (!linkedGoals.length) { container.innerHTML = '<div class="empty-state" style="font-size:11px">No linked todos yet.</div>'; return; }

  let _habits        = [];

  let _activeChallenges = [];
  let _rtLoadedDays  = 30;
  let _rtDays        = [];

  function getRtDays(n) {
    const days = [];
    const d = new Date();
    for (let i = 0; i < n; i++) { days.push(dateToKey(d)); d.setDate(d.getDate() - 1); }
    return days;
  }

  async function loadRoutineTracker() {
    _habits = await HabitsData.loadHabits();
    _rtDays = getRtDays(_rtLoadedDays);
    if (_rtDays.length) {
      const start = _rtDays[_rtDays.length - 1];
      const end   = _rtDays[0];
      const [logs, notes, challenges] = await Promise.all([
        HabitsData.loadHabitLogs(start, end),
        HabitsData.loadDayNotes(start, end),
        HabitsData.loadActiveChallenges(),
      ]);
      _habitLogs = {};
      logs.forEach(l => { _habitLogs[l.habit_id + ':' + l.date] = l; });
      _dayNotes = {};
      notes.forEach(n => { _dayNotes[n.date] = n; });
      _activeChallenges = challenges;
    }
    renderRoutineTracker();
  }

  function renderRoutineTracker() {
    renderChallengeBanner();
    renderHabitGrid();
  }

  function renderChallengeBanner() {
    const wrap = document.getElementById('rtChallengeWrap');
    wrap.innerHTML = '';
    if (!_activeChallenges.length) return;
    const ch = _activeChallenges[0];
    const startD = new Date(ch.start_date + 'T00:00:00');
    const today  = new Date();
    today.setHours(0,0,0,0);
    const elapsed  = Math.max(0, Math.floor((today - startD) / 86400000) + 1);
    const remaining = Math.max(0, ch.duration_days - elapsed);
    const chHabits  = _habits.filter(h => ch.habit_ids.includes(h.id));

    let streak = 0, successDays = 0;
    for (let i = elapsed - 1; i >= 0; i--) {
      const d = new Date(startD); d.setDate(d.getDate() + i);
      const ds = dateToKey(d);
      const allDone = chHabits.every(h => (_habitLogs[h.id+':'+ds] || {}).completed);
      if (i === elapsed - 1 || (ch.mode === 'lenient' && allDone) || (ch.mode === 'strict' && allDone)) {
        if (allDone) { streak++; successDays++; }
        else if (ch.mode === 'strict') break;
      } else {
        if (allDone) successDays++;
      }
    }
    const successRate = elapsed > 0 ? Math.round(successDays / elapsed * 100) : 0;
    const pct = Math.round(elapsed / ch.duration_days * 100);

    wrap.innerHTML = `<div class="rt-challenge">
      <div class="rt-challenge-hd">
        <div class="rt-challenge-name"><span class="rt-challenge-badge">ACTIVE</span>${esc(ch.name)}</div>
        <button class="rt-action-btn" id="rtAbandonBtn" type="button" style="border:1px solid rgba(255,107,107,0.22);border-radius:8px;background:transparent;color:var(--danger);font-size:11px;font-weight:600;padding:5px 10px;cursor:pointer;font-family:inherit;">Abandon</button>
      </div>
      <div class="rt-challenge-stats">
        <div class="rt-cstat"><div class="rt-cstat-num">${elapsed}</div><div class="rt-cstat-lbl">Days done</div></div>
        <div class="rt-cstat"><div class="rt-cstat-num">${remaining}</div><div class="rt-cstat-lbl">Remaining</div></div>
        <div class="rt-cstat"><div class="rt-cstat-num">${streak}</div><div class="rt-cstat-lbl">Streak</div></div>
        <div class="rt-cstat"><div class="rt-cstat-num">${successRate}%</div><div class="rt-cstat-lbl">Success</div></div>
      </div>
      <div class="rt-challenge-prog"><div class="rt-challenge-prog-fill" style="width:${pct}%"></div></div>
    </div>`;

    wrap.querySelector('#rtAbandonBtn').addEventListener('click', async () => {
      if (!confirm('Abandon this challenge?')) return;
      await HabitsData.updateChallenge(ch.id, { status: 'abandoned' });
      loadRoutineTracker();
    });
  }

  function renderHabitGrid() {
    const grid = document.getElementById('rtGrid');
    grid.innerHTML = '';
    const activeHabits = _habits.filter(h => h.active);
    if (!activeHabits.length) {
      grid.style.display = 'none';
      document.getElementById('rtLoadMore').style.display = 'none';
      return;
    }
    grid.style.display = 'grid';
    grid.style.gridTemplateColumns = `72px repeat(${activeHabits.length}, 48px) 80px`;

    // Header row
    const hdDate = document.createElement('div');
    hdDate.className = 'rt-hd-date'; hdDate.textContent = 'DATE';
    grid.appendChild(hdDate);

    activeHabits.forEach(h => {
      const streak = HabitsData.computeStreak(h.id, Object.values(_habitLogs), false);
      const hdH = document.createElement('div');
      hdH.className = 'rt-hd-habit';
      hdH.innerHTML = `<div class="rt-hd-habit-inner">
        <span class="rt-hd-habit-icon">${esc(h.icon||'●')}</span>
        <span class="rt-hd-habit-name">${esc(h.name)}</span>
        <span class="rt-hd-habit-streak">${streak > 0 ? '🔥 '+streak : ''}</span>
      </div>`;
      hdH.addEventListener('click', () => openHabitModal(h));
      grid.appendChild(hdH);
    });

    const hdPct = document.createElement('div');
    hdPct.className = 'rt-hd-day-pct'; hdPct.textContent = 'DAY %';
    grid.appendChild(hdPct);

    // Data rows
    _rtDays.forEach((ds, idx) => {
      const isToday = ds === todayDateStr;
      const isLast  = idx === _rtDays.length - 1;
      const rowClass = (isToday ? ' rt-row-today' : '') + (isLast ? ' rt-row-last' : '');

      const cellDate = document.createElement('div');
      cellDate.className = 'rt-cell-date' + (isToday ? ' today-lbl' : '') + rowClass.split(' rt-').slice(1).map(c=>c?' rt-'+c:'').join('');
      // just apply row class via data attribute for date cell
      cellDate.className = 'rt-cell-date' + (isToday ? ' today-lbl' : '');
      if (isToday) cellDate.classList.add('rt-row-today');
      if (isLast)  cellDate.classList.add('rt-row-last');

      const parts = ds.split('-').map(Number);
      const d = new Date(parts[0], parts[1]-1, parts[2]);
      const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      cellDate.textContent = dayNames[d.getDay()] + ' ' + pad2(parts[2]);
      // Day note
      const note = _dayNotes[ds];
      const noteBtn = document.createElement('button');
      noteBtn.className = 'rt-note-btn' + (note ? ' has-note' : '');
      noteBtn.title = note ? note.note : 'Add note';
      noteBtn.textContent = note ? '📝' : '·';
      noteBtn.addEventListener('click', () => openDayNoteModal(ds));
      cellDate.appendChild(noteBtn);
      grid.appendChild(cellDate);

      let doneCount = 0;
      activeHabits.forEach(h => {
        const log = _habitLogs[h.id + ':' + ds];
        const completed = !!(log && log.completed);
        if (completed) doneCount++;

        const cell = document.createElement('div');
        cell.className = 'rt-cell';
        if (isToday) cell.classList.add('rt-row-today');
        if (isLast)  cell.classList.add('rt-row-last');

        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.className = 'rt-hb-check'; cb.checked = completed;
        cb.addEventListener('change', async () => {
          await HabitsData.toggleHabitLog(h.id, ds, cb.checked);
          loadRoutineTracker();
        });
        cell.appendChild(cb);
        grid.appendChild(cell);
      });

      const pct = activeHabits.length > 0 ? Math.round(doneCount / activeHabits.length * 100) : 0;
      const pctCell = document.createElement('div');
      pctCell.className = 'rt-cell-pct';
      if (isToday) pctCell.classList.add('rt-row-today');
      if (isLast)  pctCell.classList.add('rt-row-last');
      pctCell.innerHTML = `<div class="rt-pct-bar"><div class="rt-pct-bar-fill" style="width:${pct}%"></div></div><div class="rt-pct-num">${pct}%</div>`;
      grid.appendChild(pctCell);
    });
  }

  function openHabitModal(existingHabit) {
    const isNew = !existingHabit;
    const bg = document.createElement('div');
    bg.className = 'rt-modal-bg';
    bg.innerHTML = `<div class="rt-modal" role="dialog" aria-modal="true">
      <div class="rt-modal-hd">
        <span class="rt-modal-ttl">${isNew ? 'New' : 'Edit'} Habit</span>
        <button class="rt-modal-x" type="button">×</button>
      </div>
      <div class="rt-field"><label class="rt-label">Icon (emoji)</label>
        <input class="rt-input" id="rhIcon" type="text" maxlength="4" placeholder="🏃" value="${esc(existingHabit?.icon||'')}"></div>
      <div class="rt-field"><label class="rt-label">Name</label>
        <input class="rt-input" id="rhName" type="text" placeholder="e.g. Exercise" value="${esc(existingHabit?.name||'')}"></div>
      <div class="rt-field" style="flex-direction:row;gap:10px">
        <div style="flex:1;display:flex;flex-direction:column;gap:6px"><label class="rt-label">Target value</label>
          <input class="rt-input" id="rhTarget" type="number" min="0" placeholder="e.g. 8" value="${existingHabit?.target_value||''}"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px"><label class="rt-label">Unit</label>
          <input class="rt-input" id="rhUnit" type="text" placeholder="glasses" value="${esc(existingHabit?.unit||'')}"></div>
      </div>
      ${!isNew ? `<div class="rt-field"><label class="rt-label">Status</label>
        <select class="rt-input" id="rhActive">
          <option value="1"${existingHabit?.active?' selected':''}>Active</option>
          <option value="0"${!existingHabit?.active?' selected':''}>Archived</option>
        </select></div>` : ''}
      <div class="rt-modal-actions">
        <button class="rt-mbtn rt-mbtn-sec" id="rhCancel" type="button">Cancel</button>
        <button class="rt-mbtn rt-mbtn-pri" id="rhSave" type="button">Save</button>
      </div>
    </div>`;
    document.body.appendChild(bg);
    document.body.classList.add('tb-no-scroll');
    const close = () => { bg.remove(); document.body.classList.remove('tb-no-scroll'); };
    bg.querySelector('.rt-modal-x').addEventListener('click', close);
    bg.querySelector('#rhCancel').addEventListener('click', close);
    bg.addEventListener('click', e => { if (e.target === bg) close(); });
    bg.querySelector('#rhSave').addEventListener('click', async () => {
      const name = bg.querySelector('#rhName').value.trim();
      if (!name) { bg.querySelector('#rhName').focus(); return; }
      const fields = {
        name,
        icon:         bg.querySelector('#rhIcon').value.trim()   || null,
        target_value: parseFloat(bg.querySelector('#rhTarget').value) || null,
        unit:         bg.querySelector('#rhUnit').value.trim()   || null,
        active:       true,
      };
      if (!isNew) fields.active = bg.querySelector('#rhActive').value === '1';
      const btn = bg.querySelector('#rhSave');
      btn.disabled = true; btn.textContent = 'Saving…';
      if (isNew) {
        const all = await HabitsData.loadHabits();
        fields.order_index = all.length;
        await HabitsData.addHabit(fields);
      } else {
        await HabitsData.updateHabit(existingHabit.id, fields);
      }
      close(); loadRoutineTracker();
    });
    bg.querySelector('#rhIcon').focus();
  }

  function openDayNoteModal(dateStr) {
    const existing = _dayNotes[dateStr];
    const bg = document.createElement('div');
    bg.className = 'rt-modal-bg';
    bg.innerHTML = `<div class="rt-modal" role="dialog" aria-modal="true">
      <div class="rt-modal-hd">
        <span class="rt-modal-ttl">Note — ${formatDate(dateStr)}</span>
        <button class="rt-modal-x" type="button">×</button>
      </div>
      <div class="rt-field">
        <textarea class="rt-input" id="rtNoteText" maxlength="280" style="resize:vertical;min-height:80px" placeholder="How did the day go? (max 280 chars)">${esc(existing?.note||'')}</textarea>
        <span style="font-size:10px;color:var(--text-tertiary);text-align:right" id="rtNoteCount">${(existing?.note||'').length}/280</span>
      </div>
      <div class="rt-modal-actions">
        ${existing ? '<button class="rt-mbtn rt-mbtn-danger" id="rtNoteDel" type="button">Delete</button>' : ''}
        <button class="rt-mbtn rt-mbtn-sec" id="rtNoteCancel" type="button">Cancel</button>
        <button class="rt-mbtn rt-mbtn-pri" id="rtNoteSave" type="button">Save</button>
      </div>
    </div>`;
    document.body.appendChild(bg);
    document.body.classList.add('tb-no-scroll');
    const close = () => { bg.remove(); document.body.classList.remove('tb-no-scroll'); };
    bg.querySelector('.rt-modal-x').addEventListener('click', close);
    bg.querySelector('#rtNoteCancel').addEventListener('click', close);
    bg.addEventListener('click', e => { if (e.target === bg) close(); });
    bg.querySelector('#rtNoteText').addEventListener('input', e => {
      bg.querySelector('#rtNoteCount').textContent = e.target.value.length + '/280';
    });
    if (existing) {
      bg.querySelector('#rtNoteDel').addEventListener('click', async () => {
        await HabitsData.deleteDayNote(dateStr);
        close(); loadRoutineTracker();
      });
    }
    bg.querySelector('#rtNoteSave').addEventListener('click', async () => {
      const note = bg.querySelector('#rtNoteText').value.trim();
      if (!note) { close(); return; }
      await HabitsData.saveDayNote(dateStr, note);
      close(); loadRoutineTracker();
    });
    bg.querySelector('#rtNoteText').focus();
  }

  function openChallengeModal() {
    const bg = document.createElement('div');
    bg.className = 'rt-modal-bg';
    const activeHabits = _habits.filter(h => h.active);
    bg.innerHTML = `<div class="rt-modal" role="dialog" aria-modal="true">
      <div class="rt-modal-hd">
        <span class="rt-modal-ttl">Start a Challenge</span>
        <button class="rt-modal-x" type="button">×</button>
      </div>
      <div class="rt-field"><label class="rt-label">Challenge name</label>
        <input class="rt-input" id="rcName" type="text" placeholder="e.g. 75 Hard" autocomplete="off"></div>
      <div class="rt-field"><label class="rt-label">Duration (days)</label>
        <input class="rt-input" id="rcDays" type="number" min="1" value="75"></div>
      <div class="rt-field"><label class="rt-label">Mode</label>
        <select class="rt-input" id="rcMode">
          <option value="strict">Strict — missing a day resets streak</option>
          <option value="lenient">Lenient — just marks the day missed</option>
        </select></div>
      <div class="rt-field"><label class="rt-label">Include habits</label>
        <div class="rt-chal-habits" id="rcHabits">
          ${activeHabits.map(h => `<div class="rt-chal-habit-opt" data-id="${h.id}">${esc(h.icon||'●')} ${esc(h.name)}</div>`).join('')}
        </div></div>
      <div class="rt-modal-actions">
        <button class="rt-mbtn rt-mbtn-sec" id="rcCancel" type="button">Cancel</button>
        <button class="rt-mbtn rt-mbtn-pri" id="rcSave" type="button">Start</button>
      </div>
    </div>`;
    document.body.appendChild(bg);
    document.body.classList.add('tb-no-scroll');
    const close = () => { bg.remove(); document.body.classList.remove('tb-no-scroll'); };
    bg.querySelector('.rt-modal-x').addEventListener('click', close);
    bg.querySelector('#rcCancel').addEventListener('click', close);
    bg.addEventListener('click', e => { if (e.target === bg) close(); });
    bg.querySelectorAll('.rt-chal-habit-opt').forEach(opt => {
      opt.addEventListener('click', () => opt.classList.toggle('selected'));
    });
    bg.querySelector('#rcSave').addEventListener('click', async () => {
      const name = bg.querySelector('#rcName').value.trim();
      const days = parseInt(bg.querySelector('#rcDays').value, 10);
      if (!name || !days || days < 1) return;
      const habitIds = [...bg.querySelectorAll('.rt-chal-habit-opt.selected')].map(o => o.dataset.id);
      if (!habitIds.length) { alert('Select at least one habit.'); return; }
      const btn = bg.querySelector('#rcSave');
      btn.disabled = true; btn.textContent = 'Starting…';
      await HabitsData.addChallenge({
        name,
        duration_days: days,
        start_date: todayDateStr,
        habit_ids: habitIds,
        mode: bg.querySelector('#rcMode').value,
        status: 'active',
      });
      close(); loadRoutineTracker();
    });
    bg.querySelector('#rcName').focus();
  }

  document.getElementById('rtAddHabitBtn').addEventListener('click', () => openHabitModal(null));
  document.getElementById('rtStartChallengeBtn').addEventListener('click', () => {
    if (_activeChallenges.length) { alert('Complete or abandon the current challenge first.'); return; }
    openChallengeModal();
  });
  document.getElementById('rtLoadMore').addEventListener('click', async () => {
    _rtLoadedDays += 30;
    await loadRoutineTracker();
  });
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
