<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All In — Generate PWA Icons</title>
<style>
body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 40px; max-width: 600px; margin: 0 auto; }
h1 { color: #d4a853; margin-bottom: 8px; }
p { color: #999; margin-bottom: 32px; }
.icon-row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 32px; }
.icon-item { text-align: center; }
canvas { border-radius: 16px; border: 1px solid #333; display: block; margin-bottom: 8px; }
a.dl-btn {
  display: inline-block; padding: 8px 16px;
  background: linear-gradient(135deg, #d4a853, #b8943f);
  color: #0a0a0b; border-radius: 8px; font-weight: 700;
  font-size: 12px; text-decoration: none; cursor: pointer;
}
.label { font-size: 11px; color: #888; margin-bottom: 6px; }
</style>
</head>
<body>
<h1>All In — PWA Icon Generator</h1>
<p>Open this page in a browser, then click each download button. Move the downloaded files into your <code>icons/</code> folder.</p>

<div class="icon-row" id="icons"></div>

<script>
const ICONS = [
  { name: 'icon-192.png',          size: 192, maskable: false },
  { name: 'icon-512.png',          size: 512, maskable: false },
  { name: 'icon-maskable-512.png', size: 512, maskable: true  }
];

function drawIcon(canvas, size, maskable) {
  const ctx = canvas.getContext('2d');
  const s = size;
  canvas.width = s;
  canvas.height = s;

  // Background
  ctx.fillStyle = '#0a0a0b';
  ctx.beginPath();
  if (maskable) {
    // Full square bg for maskable
    ctx.rect(0, 0, s, s);
  } else {
    // Rounded rect
    const r = s * 0.18;
    ctx.moveTo(r, 0);
    ctx.lineTo(s - r, 0);
    ctx.quadraticCurveTo(s, 0, s, r);
    ctx.lineTo(s, s - r);
    ctx.quadraticCurveTo(s, s, s - r, s);
    ctx.lineTo(r, s);
    ctx.quadraticCurveTo(0, s, 0, s - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
  }
  ctx.fill();

  // Ring: for maskable, ring stays in safe zone (inner 80%)
  const safeScale = maskable ? 0.56 : 0.66;
  const cx = s / 2;
  const cy = s / 2;
  const radius = s * safeScale;

  const grad = ctx.createLinearGradient(cx - radius, cy - radius, cx + radius, cy + radius);
  grad.addColorStop(0,   '#f0d48a');
  grad.addColorStop(0.5, '#d4a853');
  grad.addColorStop(1,   '#b8943f');

  // Glow
  ctx.save();
  ctx.shadowColor = 'rgba(212,168,83,0.55)';
  ctx.shadowBlur = s * 0.06;

  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.strokeStyle = grad;
  ctx.lineWidth = s * 0.085;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();
}

const container = document.getElementById('icons');

ICONS.forEach(({ name, size, maskable }) => {
  const item = document.createElement('div');
  item.className = 'icon-item';

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = name + ' (' + size + 'px)';

  const canvas = document.createElement('canvas');
  const displaySize = Math.min(size, 128);
  canvas.style.width = displaySize + 'px';
  canvas.style.height = displaySize + 'px';
  drawIcon(canvas, size, maskable);

  const btn = document.createElement('a');
  btn.className = 'dl-btn';
  btn.textContent = 'Download';
  btn.download = name;
  btn.href = canvas.toDataURL('image/png');

  item.appendChild(label);
  item.appendChild(canvas);
  item.appendChild(btn);
  container.appendChild(item);
});
</script>
</body>
</html>
