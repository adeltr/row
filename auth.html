<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('theme:preference')||'dark');})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>All In — Sign In</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root, [data-theme="dark"] {
  --bg: #0a0a0b;
  --bg-card: #111113;
  --bg-input: rgba(255,255,255,0.04);
  --bg-input-focus: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.08);
  --border-focus: rgba(212,168,83,0.55);
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-muted: rgba(255,255,255,0.3);
  --accent-gold: #d4a853;
  --accent-gold-hover: #b8943f;
  --accent-gold-glow: rgba(212,168,83,0.4);
  --accent-gold-glow-strong: rgba(212,168,83,0.7);
  --danger: rgba(239,68,68,0.12);
  --danger-border: rgba(239,68,68,0.25);
  --danger-text: #fca5a5;
  --success-bg: rgba(212,168,83,0.08);
  --success-border: rgba(212,168,83,0.25);
  --success-text: #d4a853;
  --font: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
  color-scheme: dark;
}
[data-theme="light"] {
  --bg: #f5f5f5;
  --bg-card: #ffffff;
  --bg-input: rgba(0,0,0,0.04);
  --bg-input-focus: rgba(0,0,0,0.06);
  --border: rgba(0,0,0,0.10);
  --border-focus: rgba(184,148,63,0.60);
  --text-primary: #1a1a1a;
  --text-secondary: #555555;
  --text-muted: rgba(0,0,0,0.35);
  --accent-gold: #b8943f;
  --accent-gold-hover: #9a7a30;
  --accent-gold-glow: rgba(184,148,63,0.35);
  --accent-gold-glow-strong: rgba(184,148,63,0.60);
  --danger: rgba(239,68,68,0.08);
  --danger-border: rgba(239,68,68,0.22);
  --danger-text: #cc2222;
  --success-bg: rgba(184,148,63,0.06);
  --success-border: rgba(184,148,63,0.22);
  --success-text: #b8943f;
  --font: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
  color-scheme: light;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  min-height: 100dvh;
  position: relative;
  overflow-y: auto;
}

/* Radial bg glow — dark center, subtle warmth */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 70% 55% at 50% 40%, rgba(212,168,83,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 100% 80% at 50% 100%, rgba(10,10,11,0.9) 0%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

/* Noise grain — dark mode only */
[data-theme="dark"] body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.012) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: 0;
}

.card {
  position: relative; z-index: 1;
  width: 100%;
  max-width: 380px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px 32px 36px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
}

/* ── Ring logo ── */
.logo-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 22px;
}

.ring-logo {
  width: 80px;
  height: 80px;
  animation: ring-pulse 3s ease-in-out infinite;
}

@keyframes ring-pulse {
  0%, 100% {
    filter: drop-shadow(0 0 6px rgba(212,168,83,0.5)) drop-shadow(0 0 14px rgba(212,168,83,0.25));
  }
  50% {
    filter: drop-shadow(0 0 14px rgba(212,168,83,0.85)) drop-shadow(0 0 28px rgba(212,168,83,0.45));
  }
}

@media (max-width: 480px) {
  .ring-logo { width: 64px; height: 64px; }
  .card { padding: 32px 24px 28px; }
}
@media (max-width: 390px) {
  body { align-items: flex-start; padding: 16px 12px; }
  .ring-logo { width: 56px; height: 56px; }
  .logo-wrap { margin-bottom: 14px; }
  .card { padding: 28px 20px 24px; }
  .brand { margin-bottom: 20px; }
}
@media (max-width: 375px) {
  .ring-logo { width: 48px; height: 48px; }
  .logo-wrap { margin-bottom: 10px; }
  .card { padding: 22px 16px 20px; }
  .brand { margin-bottom: 16px; }
  .field { margin-bottom: 10px; }
}

/* ── Brand text ── */
.brand {
  text-align: center;
  margin-bottom: 32px;
}

.brand-name {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 0.14em;
  color: var(--text-primary);
  line-height: 1;
  margin-bottom: 8px;
}

.brand-tagline {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.10em;
  text-transform: uppercase;
  line-height: 1.4;
}

/* ── Mode tabs ── */
.mode-tabs {
  display: flex;
  gap: 2px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 26px;
}

.mode-tab {
  flex: 1;
  padding: 8px;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  border-radius: 7px;
  cursor: pointer;
  transition: background 0.18s, color 0.18s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.mode-tab.active {
  background: rgba(212,168,83,0.15);
  color: var(--accent-gold);
}

/* ── Form fields ── */
.field { margin-bottom: 16px; }

.field label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.field input {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 14px;
  color: var(--text-primary);
  font-family: var(--font);
  outline: none;
  transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
}

.field input:focus {
  border-color: var(--border-focus);
  background: var(--bg-input-focus);
  box-shadow: 0 0 0 3px rgba(212,168,83,0.12);
}

.field input::placeholder { color: var(--text-muted); }

/* ── Submit button ── */
.submit-btn {
  width: 100%;
  margin-top: 6px;
  padding: 13px;
  background: linear-gradient(135deg, #d4a853 0%, #b8943f 100%);
  border: none;
  border-radius: 10px;
  color: #0a0a0b;
  font-size: 12px;
  font-weight: 800;
  font-family: var(--font);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.18s, transform 0.12s, box-shadow 0.18s;
  box-shadow: 0 4px 20px rgba(212,168,83,0.35);
  -webkit-tap-highlight-color: transparent;
}

.submit-btn:hover {
  opacity: 0.92;
  box-shadow: 0 6px 28px rgba(212,168,83,0.5);
}

.submit-btn:active { transform: scale(0.98); }
.submit-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

/* ── Forgot password ── */
.forgot-link {
  display: block;
  text-align: center;
  margin-top: 14px;
  font-size: 11px;
  color: var(--text-muted);
  cursor: pointer;
  transition: color 0.15s;
  text-decoration: none;
  letter-spacing: 0.04em;
  -webkit-tap-highlight-color: transparent;
}

.forgot-link:hover { color: var(--accent-gold); }
#forgot-wrap { display: block; }
#forgot-wrap.hidden { display: none; }

/* ── Messages ── */
.msg {
  margin-top: 14px;
  padding: 11px 14px;
  border-radius: 10px;
  font-size: 12px;
  line-height: 1.5;
  display: none;
}

.msg.show { display: block; }

.msg.error {
  background: var(--danger);
  border: 1px solid var(--danger-border);
  color: var(--danger-text);
}

.msg.success {
  background: var(--success-bg);
  border: 1px solid var(--success-border);
  color: var(--success-text);
}

/* iOS zoom prevention */
html { text-size-adjust: 100%; -webkit-text-size-adjust: 100%; }
button, a, label, [role="button"] { touch-action: manipulation; }
@media (max-width: 768px) {
  input, select, textarea { font-size: 16px !important; }
}

/* ── iOS segmented control ── */
.mode-tabs { background: rgba(120,120,128,0.16) !important; border: none !important; border-radius: 10px !important; gap: 0 !important; }
.mode-tab { font-family: var(--font, 'Inter', -apple-system, sans-serif) !important; font-size: 13px !important; font-weight: 600 !important; text-transform: none !important; letter-spacing: 0 !important; border-radius: 8px !important; padding: 7px 14px !important; color: var(--text-muted) !important; transition: background 0.2s, color 0.2s, box-shadow 0.2s !important; }
.mode-tab.active { background: rgba(212,168,83,0.18) !important; color: var(--accent-gold) !important; box-shadow: 0 1px 4px rgba(0,0,0,0.2) !important; }
</style>
</head>
<body>
<div class="card">

  <!-- Ring logo -->
  <div class="logo-wrap">
    <svg class="ring-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="auth-ring-grad" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#f0d48a"/>
          <stop offset="50%" stop-color="#d4a853"/>
          <stop offset="100%" stop-color="#b8943f"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="37" fill="none" stroke="url(#auth-ring-grad)" stroke-width="9" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Brand -->
  <div class="brand">
    <div class="brand-name">ALL IN</div>
    <div class="brand-tagline">One subscription to govern them all</div>
  </div>

  <!-- Mode tabs -->
  <div class="mode-tabs">
    <div class="mode-tab active" data-mode="signin">Sign In</div>
    <div class="mode-tab" data-mode="signup">Sign Up</div>
  </div>

  <!-- Form -->
  <form id="auth-form" autocomplete="on">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com"
             inputmode="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••"
             autocomplete="current-password" required>
    </div>
    <button type="submit" class="submit-btn" id="submit-btn">Sign In</button>
    <div id="forgot-wrap">
      <a class="forgot-link" id="forgot-link">Forgot password?</a>
    </div>
    <div class="msg error" id="error-msg"></div>
    <div class="msg success" id="success-msg"></div>
  </form>

</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './js/config.js';
  import { signIn, signUp } from './js/auth.js';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let mode = 'signin';

  const tabs       = document.querySelectorAll('.mode-tab');
  const submitBtn  = document.getElementById('submit-btn');
  const errorMsg   = document.getElementById('error-msg');
  const successMsg = document.getElementById('success-msg');
  const pwInput    = document.getElementById('password');
  const forgotWrap = document.getElementById('forgot-wrap');
  const forgotLink = document.getElementById('forgot-link');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      window.haptic && window.haptic('light');
      mode = tab.dataset.mode;
      tabs.forEach(t => t.classList.toggle('active', t === tab));
      submitBtn.textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
      pwInput.autocomplete  = mode === 'signin' ? 'current-password' : 'new-password';
      forgotWrap.classList.toggle('hidden', mode !== 'signin');
      errorMsg.classList.remove('show');
      successMsg.classList.remove('show');
    });
  });

  forgotLink.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    if (!email) {
      errorMsg.textContent = 'Enter your email address first.';
      errorMsg.classList.add('show');
      return;
    }
    forgotLink.textContent = 'Sending…';
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/auth.html'
    });
    forgotLink.textContent = 'Forgot password?';
    if (error) {
      errorMsg.textContent = error.message;
      errorMsg.classList.add('show');
    } else {
      successMsg.textContent = 'Reset link sent — check your email.';
      successMsg.classList.add('show');
    }
  });

  document.getElementById('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = pwInput.value;

    errorMsg.classList.remove('show');
    successMsg.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = mode === 'signin' ? 'Signing in…' : 'Creating account…';

    try {
      if (mode === 'signin') {
        const { error } = await signIn(email, password);
        if (error) throw error;
        const returnUrl = sessionStorage.getItem('auth_return') || 'index.html';
        sessionStorage.removeItem('auth_return');
        location.replace(returnUrl);
      } else {
        const { error } = await signUp(email, password);
        if (error) throw error;
        successMsg.textContent = 'Account created! Sign in now (or check email if confirmation is enabled).';
        successMsg.classList.add('show');
        submitBtn.textContent = 'Create Account';
        submitBtn.disabled = false;
      }
    } catch (err) {
      errorMsg.textContent = err.message || 'Something went wrong.';
      errorMsg.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
    }
  });
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
